<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>buscaCatastro | Inteligencia Inmobiliaria y Catastro Costa Rica</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Proj4js para reproyeccion CRTM05 (Costa Rica) a WGS84 (GPS/Web) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

  <style>
    #map { height: 100vh; width: 100%; z-index: 10; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex overflow-hidden">

  <!-- SIDEBAR IZQUIERDO -->
  <aside class="w-96 h-screen glass border-r border-slate-800 flex flex-col z-20 shadow-2xl">
    <!-- Header -->
    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-emerald-500/20">
          📍
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">buscaCatastro</h1>
          <p class="text-xs text-slate-400">Inteligencia Patrimonial · Costa Rica</p>
        </div>
      </div>
      <span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-500/20">Zarcero Piloto</span>
    </div>

    <!-- Buscador de Fincas / Planos -->
    <div class="p-4 border-b border-slate-800 space-y-3">
      <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Búsqueda Catastral WFS</label>
      <div class="flex space-x-2">
        <input id="inputFinca" type="text" placeholder="Ej: 214978 (Finca)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
        <button onclick="buscarFinca()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-md shadow-emerald-600/20">
          Buscar
        </button>
      </div>
    </div>

    <!-- Filtros de Capas -->
    <div class="p-4 border-b border-slate-800 space-y-3">
      <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Capas de Inteligencia</label>
      <div class="space-y-2 text-sm">
        <label class="flex items-center space-x-2 cursor-pointer p-2 rounded-lg hover:bg-slate-800/50 transition">
          <input type="checkbox" id="chkRemates" checked onchange="toggleCapaRemates()" class="rounded bg-slate-900 border-slate-700 text-rose-500 focus:ring-0">
          <span class="w-3 h-3 rounded-full bg-rose-500 inline-block shadow-sm shadow-rose-500/50"></span>
          <span class="font-medium text-slate-200">Edictos de Remate (Boletín)</span>
        </label>
        <label class="flex items-center space-x-2 cursor-pointer p-2 rounded-lg hover:bg-slate-800/50 transition">
          <input type="checkbox" id="chkVacios" checked onchange="toggleCapaVacios()" class="rounded bg-slate-900 border-slate-700 text-amber-400 focus:ring-0">
          <span class="w-3 h-3 rounded-full bg-amber-400 inline-block shadow-sm shadow-amber-400/50"></span>
          <span class="font-medium text-slate-200">Eslabones Perdidos (Vacíos)</span>
        </label>
      </div>
    </div>

    <!-- Acciones Rápidas -->
    <div class="p-4 border-b border-slate-800 space-y-2">
      <button onclick="ejecutarGapAnalysis()" class="w-full bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 py-2.5 px-3 rounded-lg text-sm font-semibold flex items-center justify-center space-x-2 transition">
        <span>⚡</span>
        <span>Detectar Vacíos (Guadalupe)</span>
      </button>
    </div>

    <!-- Lista de Oportunidades -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Oportunidades Registradas</label>
        <span id="badgeConteo" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">0</span>
      </div>
      <div id="listaRemates" class="space-y-2">
        <p class="text-xs text-slate-500 italic text-center py-4">Cargando datos locales...</p>
      </div>
    </div>
  </aside>

  <!-- MAPA PRINCIPAL -->
  <main class="flex-1 relative">
    <div id="map"></div>

    <!-- CARD FLOTANTE DE DETALLE REGISTRAL / PATRIMONIAL -->
    <div id="panelDetalle" class="hidden absolute top-5 right-5 w-96 glass border border-slate-800 rounded-2xl p-5 z-20 shadow-2xl space-y-4">
      <div class="flex items-start justify-between">
        <div>
          <span id="detalleTipo" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Predio</span>
          <h2 id="detalleTitulo" class="text-lg font-bold text-slate-100 mt-1">Finca</h2>
        </div>
        <button onclick="cerrarDetalle()" class="text-slate-400 hover:text-slate-200 text-lg">&times;</button>
      </div>

      <div id="detalleContenido" class="space-y-2 text-xs text-slate-300">
        <!-- Renderizado dinámico -->
      </div>

      <!-- SECCIÓN DIAGNÓSTICO ESTRATÉGICO -->
      <div class="pt-3 border-t border-slate-800">
        <button onclick="ejecutarDiagnostico()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-2 px-3 rounded-xl shadow-lg shadow-emerald-600/20 text-xs flex items-center justify-center space-x-2 transition">
          <span>⚖️</span>
          <span>Analizar Saneamiento Patrimonial</span>
        </button>
      </div>

      <div id="resultadoDiagnostico" class="hidden p-3 bg-slate-900/90 rounded-xl border border-slate-700 text-xs space-y-1.5">
        <p class="font-bold text-emerald-400 text-xs" id="diagEstrategia">Estrategia</p>
        <p class="text-slate-300 text-[11px]" id="diagDictamen">Dictamen</p>
      </div>
    </div>
  </main>

  <script>
    // 1. Configurar Proj4 para Costa Rica: CRTM05 (EPSG:5367) a WGS84 (EPSG:4326)
    proj4.defs("EPSG:5367", "+proj=tmerc +lat_0=0 +lon_0=-84 +k=0.9999 +x_0=500000 +y_0=0 +ellps=WGS84 +units=m +no_defs");

    function crtm05ToWgs84(x, y) {
      return proj4("EPSG:5367", "EPSG:4326", [x, y]);
    }

    function reproyectarGeoJson(geojson) {
      if (!geojson) return null;
      let clon = JSON.parse(JSON.stringify(geojson));
      function reproyectarCoords(coords) {
        if (typeof coords[0] === 'number') {
          // [X, Y] CRTM05 -> [Lon, Lat] WGS84
          let pt = crtm05ToWgs84(coords[0], coords[1]);
          return [pt[0], pt[1]];
        }
        return coords.map(reproyectarCoords);
      }
      if (clon.type === 'FeatureCollection') {
        clon.features.forEach(f => f.geometry.coordinates = reproyectarCoords(f.geometry.coordinates));
      } else if (clon.geometry) {
        clon.geometry.coordinates = reproyectarCoords(clon.geometry.coordinates);
      }
      return clon;
    }

    // 2. Inicializar Mapa Leaflet centrado en Zarcero
    const map = L.map('map', { zoomControl: false }).setView([10.188, -84.394], 14);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Capas Base
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri Satellite'
    }).addTo(map);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'OSM'
    });

    L.control.layers({ "Satélite": esriSat, "Calles (OSM)": osm }, null, { position: 'bottomright' }).addTo(map);

    // Grupos de capas
    const capaRematesGroup = L.layerGroup().addTo(map);
    const capaVaciosGroup = L.layerGroup().addTo(map);
    const capaBusquedaGroup = L.layerGroup().addTo(map);

    let fincaSeleccionada = null;

    // 3. Cargar Remates desde SQLite al iniciar
    async function cargarRemates() {
      try {
        const res = await fetch('/api/remates?canton=Zarcero');
        const data = await res.json();
        const listaEl = document.getElementById('listaRemates');
        document.getElementById('badgeConteo').innerText = data.length;

        if (data.length === 0) {
          listaEl.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">No hay remates activos en BD.<br>Usa el CLI o escanea una fecha.</p>';
          return;
        }

        listaEl.innerHTML = '';
        data.forEach(r => {
          const card = document.createElement('div');
          card.className = 'p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-emerald-500/50 cursor-pointer transition';
          card.onclick = () => verDetalleRemate(r);
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-bold text-xs text-emerald-400">${r.folio_real}</span>
              <span class="text-[10px] bg-rose-500/10 text-rose-400 px-1.5 py-0.5 rounded font-semibold border border-rose-500/20">Remate</span>
            </div>
            <p class="text-xs text-slate-300 font-semibold mt-1">${r.moneda} ${r.monto_base.toLocaleString()}</p>
            <p class="text-[11px] text-slate-400 truncate mt-0.5">${r.acreedor || 'Cobro Judicial'}</p>
          `;
          listaEl.appendChild(card);
        });
      } catch (err) {
        console.error("Error cargando remates:", err);
      }
    }

    // 4. Buscar finca individual en WFS
    async function buscarFinca() {
      const valor = document.getElementById('inputFinca').value.trim();
      if (!valor) return;

      try {
        const res = await fetch(`/api/catastro/buscar?finca=${valor}`);
        if (!res.ok) {
          alert("Predio no encontrado en el catastro digital de Zarcero.");
          return;
        }
        const featCRTM = await res.json();
        const featWGS = reproyectarGeoJson(featCRTM);

        capaBusquedaGroup.clearLayers();
        const layer = L.geoJSON(featWGS, {
          style: { color: '#10b981', weight: 3, fillColor: '#10b981', fillOpacity: 0.35 }
        }).addTo(capaBusquedaGroup);

        map.fitBounds(layer.getBounds(), { maxZoom: 18 });
        mostrarDetallePredio(featCRTM.properties);
      } catch (err) {
        alert("Error al consultar el servicio catastral.");
      }
    }

    // 5. Ejecutar Gap Analysis (Vacíos)
    async function ejecutarGapAnalysis() {
      try {
        const res = await fetch('/api/vacios/geojson?distrito=Guadalupe&area_min=400&limite_predios=80');
        const dataCRTM = await res.json();
        const dataWGS = reproyectarGeoJson(dataCRTM);

        capaVaciosGroup.clearLayers();
        L.geoJSON(dataWGS, {
          style: { color: '#fbbf24', weight: 2, fillColor: '#fbbf24', fillOpacity: 0.4 },
          onEachFeature: (feat, layer) => {
            layer.bindPopup(`
              <div class="text-slate-900 text-xs">
                <b>Eslabón Perdido:</b> ${feat.properties.id_vacio}<br>
                <b>Área estimada:</b> ${feat.properties.area_m2.toLocaleString()} m²<br>
                <b>Colinda con:</b> ${feat.properties.colindantes}
              </div>
            `);
          }
        }).addTo(capaVaciosGroup);

        if (dataWGS.features.length > 0) {
          alert(`¡Se detectaron ${dataWGS.features.length} vacíos catastrales en Guadalupe! Revisa los polígonos amarillos en el mapa.`);
        }
      } catch (err) {
        alert("Error al ejecutar el Gap Analysis.");
      }
    }

    // 6. Panel de Detalle y Diagnóstico
    function mostrarDetallePredio(p) {
      fincaSeleccionada = `2-${p.finca}-000`;
      document.getElementById('detalleTipo').innerText = "Predio Catastrado";
      document.getElementById('detalleTitulo').innerText = `Finca 2-${p.finca}-000`;
      document.getElementById('detalleContenido').innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <div><span class="text-slate-500">Distrito:</span> ${p.distrito}</div>
          <div><span class="text-slate-500">Plano:</span> ${p.plano || 'N/A'}</div>
          <div><span class="text-slate-500">Área Reg:</span> ${p.area_registro_m2 || 'N/A'} m²</div>
          <div><span class="text-slate-500">Área GIS:</span> ${Math.round(p.area_poligono_m2 || 0)} m²</div>
          <div><span class="text-slate-500">Frente/Fondo:</span> ${p.frente_m || 0}m / ${p.fondo_m || 0}m</div>
          <div><span class="text-slate-500">Construcciones:</span> ${p.construcciones}</div>
        </div>
      `;
      document.getElementById('resultadoDiagnostico').classList.add('hidden');
      document.getElementById('panelDetalle').classList.remove('hidden');
    }

    function verDetalleRemate(r) {
      fincaSeleccionada = r.folio_real;
      document.getElementById('detalleTipo').innerText = "Edicto de Remate";
      document.getElementById('detalleTitulo').innerText = r.folio_real;
      document.getElementById('detalleContenido').innerHTML = `
        <p class="text-emerald-400 font-bold text-sm">${r.moneda} ${r.monto_base.toLocaleString()}</p>
        <p><span class="text-slate-500">Expediente:</span> ${r.expediente || 'N/A'}</p>
        <p><span class="text-slate-500">Acreedor:</span> ${r.acreedor || 'Cobro Judicial'}</p>
        <p><span class="text-slate-500">Demandado:</span> ${r.demandado || 'N/A'}</p>
        <p><span class="text-slate-500">Ubicación:</span> ${r.distrito || 'Zarcero'}, Alajuela</p>
      `;
      document.getElementById('resultadoDiagnostico').classList.add('hidden');
      document.getElementById('panelDetalle').classList.remove('hidden');

      // Intentar buscar polígono en mapa automáticamente
      const numFinca = r.folio_real.split('-')[1];
      if (numFinca) {
        document.getElementById('inputFinca').value = numFinca;
        buscarFinca();
      }
    }

    async function ejecutarDiagnostico() {
      if (!fincaSeleccionada) return;
      try {
        const res = await fetch(`/api/diagnostico?folio=${fincaSeleccionada}&escenario=sociedad_disuelta`);
        const diag = await res.json();
        document.getElementById('diagEstrategia').innerText = `Estrategia: ${diag.estrategia_sugerida}`;
        document.getElementById('diagDictamen').innerText = diag.dictamen;
        document.getElementById('resultadoDiagnostico').classList.remove('hidden');
      } catch (err) {
        alert("Error al diagnosticar.");
      }
    }

    function cerrarDetalle() {
      document.getElementById('panelDetalle').classList.add('hidden');
    }

    function toggleCapaRemates() {
      const chk = document.getElementById('chkRemates').checked;
      if (chk) map.addLayer(capaRematesGroup);
      else map.removeLayer(capaRematesGroup);
    }

    function toggleCapaVacios() {
      const chk = document.getElementById('chkVacios').checked;
      if (chk) map.addLayer(capaVaciosGroup);
      else map.removeLayer(capaVaciosGroup);
    }

    // Inicializar
    cargarRemates();
  </script>
</body>
</html>
